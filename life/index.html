    .life-head p { margin: 6px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
    .life-demo { display: inline-block; margin-top: 10px; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; color: var(--red); background: rgba(181,83,60,.1); }
    .life-legend { display: flex; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
    .life-modes { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; pointer-events: auto; }
    .life-modes button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 99px; background: rgba(248,246,241,.92); font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
    .life-modes button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .life-time[hidden] { display: none; }
    .life-legend { flex-wrap: wrap; }
    .life-legend i { border-radius: 2px; }
    .life-legend i.dot { border-radius: 50%; }
    .life-legend i { display: inline-block; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

    .life-time { position: absolute; left: 50%; transform: translateX(-50%); bottom: 26px; z-index: 3; width: min(860px, calc(100% - 56px)); display: flex; align-items: flex-start; gap: 14px; padding: 12px 18px 8px; background: rgba(248,246,241,.9); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(6px); box-sizing: border-box; }
    #play { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); font-size: 12px; cursor: pointer; }
    .life-now { flex: 0 0 150px; min-width: 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
    .life-now b, .life-now span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .life-now b { color: var(--ink); font-weight: 600; }
    .lp-also { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
    .lp-also button { margin-left: 6px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; background: none; font: inherit; color: var(--blue); cursor: pointer; }
    .life-track { position: relative; flex: 1; min-width: 0; height: 46px; }
    #scrub { position: absolute; left: 0; right: 0; top: 6px; width: 100%; margin: 0; accent-color: var(--blue); cursor: pointer; }
    .tick { position: absolute; top: 25px; transform: translateX(-50%); padding: 2px 3px; border: 0; background: none; font: inherit; font-size: 11.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tick.lit { color: var(--ink); }
    .tick.sel { color: var(--red); font-weight: 600; }

    .life-panel { position: absolute; z-index: 4; top: 18px; right: 18px; bottom: 18px; width: 350px; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(29,27,24,.14); transform: translateX(calc(100% + 30px)); transition: transform .4s cubic-bezier(.2,.8,.2,1); overflow: hidden; visibility: hidden; }
    .life-panel.open { transform: none; visibility: visible; }
    .life-panel.no-photo { bottom: auto; }
    .life-panel.no-photo .lp-main { display: none; }
    .life-panel.no-photo .lp-body { flex: none; padding-right: 44px; }
    .life-panel .lp-x { display: none; position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: none; color: var(--ink); font-size: 18px; line-height: 1; cursor: pointer; }
    .life-panel.no-photo .lp-x { display: block; }
    .lp-main { position: relative; flex: none; aspect-ratio: 4 / 3; background: #e7e2d7; }
    .lp-main img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .lp-close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: rgba(248,246,241,.92); color: var(--ink); font-size: 16px; line-height: 1; cursor: pointer; }
    .lp-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(248,246,241,.85); color: var(--ink); cursor: pointer; }
    .lp-arrow.l { left: 10px; } .lp-arrow.r { right: 10px; }
    .lp-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; }
    .lp-kicker { font-size: 12px; color: var(--muted); }
    .lp-kicker b { color: var(--blue); font-weight: 600; }
    .lp-body h2 { margin: 4px 0 8px; font-size: 25px; line-height: 1.2; color: var(--ink); border: 0; padding: 0; }
    .lp-body p { margin: 0; font-size: 14px; line-height: 1.65; color: var(--muted); }
    .lp-thumbs { display: flex; gap: 8px; margin-top: 14px; }
    .lp-thumbs button { width: 62px; height: 46px; padding: 0; border: 2px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; background: none; }

    .lp-thumbs img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .lp-nav { flex: none; display: flex; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--line); }
    .lp-nav button { border: 0; background: none; font: inherit; font-size: 13px; color: var(--blue); cursor: pointer; padding: 4px 6px; }
    .lp-nav button:disabled { color: #bbb4a6; cursor: default; }

<main class="life-stage">
  <div id="map"></div>

  <div class="life-head">
    <h1>Life</h1>
    <p>Places I have lived and travelled. Click a city for details.</p>
    <div class="life-modes" id="modes" role="group" aria-label="Map view"><button data-m="cities">Cities</button><button data-m="visits">Countries: visits</button><button data-m="time">Countries: time</button><button data-m="journey">Journey</button></div>
    <div class="life-legend" id="legend"></div>
  </div>

  <div class="life-time" id="timebar" hidden>
    <button id="play" aria-label="Play or pause the journey">&#10073;&#10073;</button>
    <div class="life-now" id="now" aria-live="off"></div>
    <div class="life-track" id="track">
      <input id="scrub" type="range" min="0" step="0.001" value="0" aria-label="Move through time" />
    </div>
  </div>

  <aside class="life-panel" id="panel" aria-live="polite">
    <button class="lp-x" id="lpX" aria-label="Close">&times;</button>
    <div class="lp-main">
      <img id="lpImg" alt="" />
      <button class="lp-arrow l" id="imgPrev" aria-label="Previous photo">&#8249;</button>
      <button class="lp-arrow r" id="imgNext" aria-label="Next photo">&#8250;</button>
      <button class="lp-close" id="lpClose" aria-label="Close">&times;</button>
    </div>
    <div class="lp-body">
      <div class="lp-kicker"><b id="lpType"></b> &middot; <span id="lpWhen"></span></div>
      <h2 id="lpName"></h2>
      <p id="lpText"></p>
      <div class="lp-thumbs" id="lpThumbs"></div>
      <div class="lp-also" id="lpAlso"></div>
    </div>
    <div class="lp-nav">
      <button id="stopPrev">&larr; Previous stop</button>
      <button id="stopNext">Next stop &rarr;</button>
    </div>
  </aside>
</main>

  });
  window.__life = { map: map, get p() { return p; } };
})();
