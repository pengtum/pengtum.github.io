    .mile-thumb { position: absolute; left: calc(var(--ox) * var(--k) * 1px - var(--t) / 2); top: calc(var(--oy) * var(--k) * 1px - var(--t) / 2); width: var(--t); height: var(--t); padding: 0; border: 3px solid #f8f6f1; border-radius: 12px; overflow: hidden; background: #e7e2d7; box-shadow: 0 6px 18px rgba(29,27,24,.3); cursor: pointer; transition: border-color .2s, opacity .2s; }

    .mile-chip { position: absolute; left: calc(var(--ox) * var(--k) * 1px); top: calc(var(--oy) * var(--k) * 1px + var(--t) / 2 + 5px); transform: translateX(-50%); padding: 1px 7px; border-radius: 99px; background: #1d1b18; color: #f8f6f1; font-size: 11px; line-height: 17px; white-space: nowrap; pointer-events: none; transition: opacity .2s; }

    .mile-box.show { visibility: visible; opacity: 1; clip-path: inset(0 0 0 0 round 14px); }
    .mile-box.plain { height: auto; }
    .mile-box.plain .mb-copy { position: static; padding: 18px 48px 19px 20px; background: none; }

  { when: "January 2020", city: "Nagoya", ox: -30, oy: -85, pos: "35% center", title: "First time abroad", text: "My first trip outside China began in Nagoya, Japan.", note: "My first time on foreign soil. All around me, people were speaking a language I could not follow, and yet most of the signs I could read — a strange and wonderful feeling. I wandered those bustling Japanese streets with no idea that, only a week later, something called Covid-19 would begin to change everything…", name: "Nagoya, Japan", lng: 136.91, lat: 35.18, photos: ["milestones/nagoya.jpg"] },
  { when: "October 2020", city: "Munich", ox: 60, oy: -85, boxPos: "85% center", title: "Starting a PhD at TU Munich", text: "Arrived in Munich to begin my doctorate.", note: "I had barely reached Marienplatz, in front of the town hall, when a friend called out: “Quick — mask off, take the picture, mask back on!” And so I came by my first photograph in Germany, taken with a racing heart.", name: "Munich, Germany", lng: 11.58, lat: 48.14, photos: ["milestones/munich.jpg"] },
  { when: "October 2022", city: "Seattle", ox: -10, oy: 78, title: "First time in the United States", text: "Landed in Seattle for ACM SIGSPATIAL 2022.", note: "My first steps on American soil, and I fell in love at once — a love that, a few years later, would carry me back to live here. I have always loved the rain, and so I loved Seattle: the scent of damp earth drifting in from somewhere far away, after the rain had passed.", name: "Seattle, WA", lng: -122.33, lat: 47.61, photos: ["milestones/seattle.jpg"] },
  { when: "May 2023", city: "Oxford", ox: -60, oy: -85, title: "Visiting scholar at Oxford", text: "Arrived for a visiting scholarship at the University of Oxford.", note: "Drifting through Oxford’s narrow lanes and sitting down to Formal Hall, I sometimes felt I had stumbled into one grand, endless Harry Potter cosplay…", name: "Oxford, UK", lng: -1.26, lat: 51.75, photos: ["milestones/oxford-1.jpg", "milestones/oxford-2.jpg", "milestones/oxford-3.jpg"] },
  { when: "August 2023", city: "Cape Town", ox: 75, oy: -60, title: "First time in Africa", text: "Cape Town, for the International Cartographic Conference, ICC 2023.", note: "My first steps in the Southern Hemisphere, in a city unlike any I had known. But there was no time to linger. We dropped our bags and set off at once — for the wild, for the Cape of Good Hope!", name: "Cape Town, South Africa", lng: 18.42, lat: -33.92, photos: ["milestones/cape-town.jpg"], pos: "center 72%" },
  { when: "June 2024", city: "Munich", ox: 135, oy: -40, boxPos: "center 42%", label: "PhD", title: "Defending my PhD", text: "PhD defense at TU Munich.", note: "Four years of a PhD gave me a few moments of the pure joy of discovery. But far more often, I was feeling my way forward in the dark, unable to see the road ahead. I cannot say what I carried with me when I left. But I walked out knowing myself far better than when I came in.", name: "Munich, Germany", lng: 11.58, lat: 48.14, photos: ["milestones/phd-defense.jpg"] },
  { when: "August 2024", city: "Boston", ox: 62, oy: 72, title: "Postdoc at MIT", text: "Arrived in Boston to begin my postdoc at MIT.", note: "From my very first day at MIT until, I suspect, forever, one thought has stayed with me: to have had the good fortune of working alongside some of the brightest people in the world is among the great treasures of my life.", name: "Boston, MA", lng: -71.06, lat: 42.36, photos: ["milestones/boston.jpg"] },

    map.setFilter('road-label-eu', k(['==', ['get', 'eu'], true]));
  }
  function applyMode(m, first) {
    mode = m;
    [].forEach.call($('modes').children, function (b) { var on = b.dataset.m === m; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    var j = m === 'journey';
    var ms = m === 'miles';
    if (ms !== flat) { flat = ms; map.setMinZoom(ms ? -1 : 1); map.setProjection({ type: ms ? 'mercator' : 'globe' }); document.body.classList.toggle('miles', ms); map.resize(); }
    $('timebar').hidden = !j; hideBox();
    mMarks.forEach(function (x) { x.style.display = ms ? 'block' : 'none'; });
    ['route', 'done', 'dots'].forEach(function (id) { map.setLayoutProperty(id, 'visibility', j ? 'visible' : 'none'); });
    selected = -1; $('panel').classList.remove('open');
    setLegend(); routeFilters();
    p = (j && !reduce) ? 0 : last; lastLit = -2; lastSel = -2;
    setPlaying(j && !reduce);
    map.setPadding({ top: 0, right: 0, bottom: 0, left: 0 });
    if (!first && !(j && !reduce)) map.flyTo({ center: view().center, zoom: view().zoom, duration: reduce ? 0 : 1200, essential: false });
    draw();
  }
  $('modes').addEventListener('click', function (e) { var m = e.target.dataset && e.target.dataset.m; if (m && m !== mode) applyMode(m); });

  function setPlaying(v) { playing = v; $('play').innerHTML = v ? '&#10073;&#10073;' : '&#9654;'; }

  function draw() {
    if (!ready) return;
    var idx = Math.min(p * STEPS, ROUTE.length - 1), floor = Math.floor(idx);
    var coords = ROUTE.slice(0, floor + 1); coords.push(posAt(idx));
    map.getSource('done').setData(coords.length > 1 ? line(coords) : pts([]));
    var lit = Math.floor(p + 0.001);
    if (lit !== lastLit || selected !== lastSel) {
      lastLit = lit; lastSel = selected;
      map.getSource('stops').setData(stopsData(lit));
      ticks.forEach(function (b) { var i = +b.dataset.i; b.classList.toggle('lit', i <= lit); b.classList.toggle('sel', i === selected); });
      var cur = STOPS[selected >= 0 ? selected : Math.min(lit, last)]; $('now').innerHTML = '<b></b><span></span>'; $('now').firstChild.textContent = cur.name; $('now').lastChild.textContent = cur.when;
    }
    var dots = [];
    if (mode !== 'journey') { /* route layers are hidden */ }
    else if (!reduce && p >= last - 1e-6) {
      for (var m = 0; m < 24; m++) dots.push(pt(posAt(((flow + m / 24) % 1) * (ROUTE.length - 1)), { head: false }));
    } else if (p < last) { dots.push(pt(posAt(idx), { head: true })); }
    map.getSource('dots').setData(pts(dots));
    scrub.value = p;
    return idx;
  }

  function tick(now) {
    var dt = prevT ? Math.min(now - prevT, 60) : 16; prevT = now;
    if (playing) {
      p += dt / SEG_MS;
      if (p >= last) { p = last; setPlaying(false); if (selected < 0) map.flyTo({ center: HOME.center, zoom: HOME.zoom, duration: 2200 }); }
      var idx = draw();
      if (playing) map.jumpTo({ center: posAt(idx), zoom: 2.1 });
    } else if (mode === 'journey' && !reduce && p >= last - 1e-6) {
      flow = (flow + dt / 90000) % 1; draw();

    requestAnimationFrame(tick);
  }

  function showPhoto(j) {
    var ph = STOPS[selected].photos; if (!ph.length) return; photo = (j + ph.length) % ph.length;
    $('lpImg').src = ph[photo]; $('lpImg').alt = 'Photo ' + (photo + 1) + ' from ' + STOPS[selected].name;
    [].forEach.call($('lpThumbs').children, function (b, n) { b.classList.toggle('on', n === photo); });
    var multi = ph.length > 1; $('imgPrev').style.display = $('imgNext').style.display = multi ? '' : 'none';
  }

  function select(i) {
    i = +i; selected = i; setPlaying(false);
    if (mode === 'journey') p = i;
    var s = STOPS[i];
    $('lpType').textContent = s.type; $('lpWhen').textContent = s.when; $('lpName').textContent = s.name; $('lpText').textContent = s.text;
    var th = $('lpThumbs'); th.innerHTML = '';

    var hasPhotos = s.photos.length > 0; $('panel').classList.toggle('no-photo', !hasPhotos); if (hasPhotos) showPhoto(0);
    var also = $('lpAlso'); also.innerHTML = ''; var others = []; STOPS.forEach(function (o, n) { if (n !== i && o.name === s.name) others.push(n); });
    if (others.length) { also.appendChild(document.createTextNode('Also here:')); others.forEach(function (n) { var b = document.createElement('button'); b.textContent = STOPS[n].when; b.onclick = function () { select(n); }; also.appendChild(b); }); }
    $('stopPrev').disabled = i === 0; $('stopNext').disabled = i === last;
    $('panel').classList.add('open');
    var wide = innerWidth > 720, pad = wide ? { right: 380, top: 0, bottom: 80, left: 0 } : { bottom: Math.round(innerHeight * 0.6), top: 0, left: 0, right: 0 };
    map.flyTo({ center: [s.lng, s.lat], zoom: 5, padding: pad, duration: reduce ? 0 : 1800, essential: false });
    draw();
  }

  function closePanel() {
    selected = -1; $('panel').classList.remove('open');
    map.flyTo({ center: view().center, zoom: view().zoom, padding: { top: 0, right: 0, bottom: 0, left: 0 }, duration: reduce ? 0 : 1600, essential: false });
    draw();
  }

  $('play').onclick = function () {
    if (playing) return setPlaying(false);
    if (selected >= 0) closePanel();
    if (p >= last) p = 0;
    map.setPadding({ top: 0, right: 0, bottom: 0, left: 0 });
    setPlaying(true);
  };
  setPlaying(false);
  scrub.oninput = function () { setPlaying(false); p = +scrub.value; if (selected >= 0) { selected = -1; $('panel').classList.remove('open'); } var i = Math.min(p * STEPS, ROUTE.length - 1); draw(); map.jumpTo({ center: posAt(i), zoom: 2.1, padding: { top: 0, right: 0, bottom: 0, left: 0 } }); };
  $('lpClose').onclick = closePanel; $('lpX').onclick = closePanel;
  new MutationObserver(function () { document.body.classList.toggle('panel-open', $('panel').classList.contains('open')); }).observe($('panel'), { attributes: true, attributeFilter: ['class'] });
  $('imgPrev').onclick = function () { showPhoto(photo - 1); };
  $('imgNext').onclick = function () { showPhoto(photo + 1); };
  $('stopPrev').onclick = function () { if (selected > 0) select(selected - 1); };
  $('stopNext').onclick = function () { if (selected >= 0 && selected < last) select(selected + 1); };
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && boxIdx >= 0) hideBox();
    if (boxIdx >= 0 && MILES[boxIdx].photos.length > 1 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { boxManual = true; setBoxPhoto(boxPhoto + (e.key === 'ArrowRight' ? 1 : -1)); }
    if (selected < 0) return;
    if (e.key === 'Escape') closePanel();
    if (e.key === 'ArrowRight') showPhoto(photo + 1);
    if (e.key === 'ArrowLeft') showPhoto(photo - 1);
  });
  window.__life = { map: map, get p() { return p; } };
})();
